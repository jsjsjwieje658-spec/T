name: Android Virtual Phone (VNC Server)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'VNC Password'
        required: false
        default: 'android123'
      api_level:
        description: 'Android API Level'
        required: false
        default: '33'
      session_minutes:
        description: 'Session Duration (max 350 min)'
        required: false
        default: '300'

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  DISPLAY: :99

jobs:
  android-vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ═══════════════════════════════════════════
      # STEP 0: DEBUG — Check system capabilities
      # ═══════════════════════════════════════════
      - name: System Check
        run: |
          echo "=== CPU Info ==="
          lscpu | grep -E "Model|CPU\(s\)|Virtualization"
          echo ""
          echo "=== KVM Check ==="
          ls -la /dev/kvm 2>/dev/null || echo "❌ /dev/kvm NOT FOUND"
          sudo ls -la /dev/kvm 2>/dev/null || echo "❌ /dev/kvm NOT FOUND even with sudo"
          echo ""
          echo "=== KVM Module ==="
          lsmod | grep kvm || echo "kvm module not loaded"
          sudo modprobe kvm 2>/dev/null || echo "modprobe kvm failed"
          sudo modprobe kvm_intel 2>/dev/null || sudo modprobe kvm_amd 2>/dev/null || echo "no kvm vendor module"
          lsmod | grep kvm
          echo ""
          echo "=== Memory ==="
          free -h
          echo ""
          echo "=== Disk ==="
          df -h /
          echo ""
          echo "=== SDK Tools ==="
          ls $ANDROID_SDK_ROOT/
          echo ""
          echo "=== Emulator binary ==="
          ls -la $ANDROID_SDK_ROOT/emulator/emulator 2>/dev/null || echo "emulator binary not found"
          
          # Fix KVM permissions
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "✓ KVM permissions fixed (666)"
          fi

      # ═══════════════════════════════════════════
      # STEP 1: Install dependencies (FIXED)
      # ═══════════════════════════════════════════
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            xvfb \
            x11vnc \
            xdotool \
            fluxbox \
            novnc \
            websockify \
            net-tools \
            file \
            wget
          
          # DO NOT install adb from apt — use SDK adb instead
          # Remove apt adb if installed
          sudo apt-get remove -y adb 2>/dev/null || true
          
          # Add SDK platform-tools to PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          
          echo "✓ Dependencies installed (SDK adb will be used)"

      # ═══════════════════════════════════════════
      # STEP 2: Verify SDK + Install system image
      # ═══════════════════════════════════════════
      - name: Setup Android SDK
        run: |
          echo "=== Existing SDK components ==="
          sdkmanager --list_installed 2>/dev/null || \
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null || \
            echo "sdkmanager not found directly, checking path..."
          
          # Accept licenses
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Install system image + emulator + platform-tools
          API="${{ github.event.inputs.api_level || '33' }}"
          
          echo "Installing system image: system-images;android-${API};google_apis;x86_64"
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "system-images;android-${API};google_apis;x86_64" \
            "emulator" \
            "platform-tools" || {
            echo "::error::Failed to install SDK components"
            exit 1
          }
          
          echo "✓ SDK components installed"
          
          # Verify
          echo "=== Verify emulator ==="
          $ANDROID_SDK_ROOT/emulator/emulator --version || echo "emulator check failed"
          echo "=== Verify adb ==="
          $ANDROID_SDK_ROOT/platform-tools/adb version || echo "adb check failed"
          echo "=== List system images ==="
          ls $ANDROID_SDK_ROOT/system-images/ 2>/dev/null
          ls $ANDROID_SDK_ROOT/system-images/android-${API}/ 2>/dev/null

      # ═══════════════════════════════════════════
      # STEP 3: Start virtual display
      # ═══════════════════════════════════════════
      - name: Start Virtual Display
        run: |
          # Kill any existing Xvfb
          sudo pkill Xvfb 2>/dev/null || true
          sleep 1
          
          # Start Xvfb — 1080x1920 for emulator to fit inside
          Xvfb :99 -screen 0 1080x1920x24 -ac +extension GLX +render -noreset &
          XVFB_PID=$!
          sleep 3
          
          # Verify Xvfb running
          if ! ps -p $XVFB_PID > /dev/null; then
            echo "::error::Xvfb failed to start"
            exit 1
          fi
          
          # Start fluxbox window manager
          DISPLAY=:99 fluxbox &
          sleep 2
          
          # Verify display works
          DISPLAY=:99 xdotool getdisplaygeometry && echo "✓ Xvfb display :99 active"
          
          echo "DISPLAY=:99" >> $GITHUB_ENV

      # ═══════════════════════════════════════════
      # STEP 4: Create AVD
      # ═══════════════════════════════════════════
      - name: Create Android Virtual Device
        run: |
          API="${{ github.event.inputs.api_level || '33' }}"
          
          # Delete existing AVD if any
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager delete avd -n android-phone 2>/dev/null || true
          rm -rf ~/.android/avd/android-phone* 2>/dev/null || true
          
          # Create AVD
          echo "no" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager create avd \
            --name android-phone \
            --package "system-images;android-${API};google_apis;x86_64" \
            --device "pixel_4" \
            --force
          
          # List AVDs
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager list avd
          
          echo "✓ AVD created"

      # ═══════════════════════════════════════════
      # STEP 5: Start Android Emulator (FIXED)
      # ═══════════════════════════════════════════
      - name: Start Android Emulator
        run: |
          # Write emulator config
          mkdir -p ~/.android/avd/android-phone.avd
          cat > ~/.android/avd/android-phone.avd/config.ini << EOF
          avd.ini.encoding=UTF-8
          hw.lcd.width=720
          hw.lcd.height=1280
          hw.lcd.density=320
          hw.ramSize=2048
          hw.cpu.ncore=2
          hw.cpu.arch=x86_64
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.keyboard=yes
          hw.audioInput=no
          hw.audioOutput=no
          hw.camera.back=none
          hw.camera.front=none
          disk.dataPartition.size=4G
          image.sysdir.1=system-images/android-33/google_apis/x86_64/
          tag.display=Google APIs
          tag.id=google_apis
          hw.device.name=pixel_4
          hw.device.manufacturer=Google
          EOF
          
          # Check KVM one more time
          echo "=== Final KVM check before emulator start ==="
          ls -la /dev/kvm || echo "WARNING: No KVM — emulator will be SLOW"
          
          # Start emulator with CORRECT flags
          # Use DISPLAY env var, NOT -display flag
          # Use -no-window is WRONG for VNC — we need it to render to X
          # Use -no-snapshot for clean boot
          
          $ANDROID_SDK_ROOT/emulator/emulator \
            -avd android-phone \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -memory 2048 \
            -no-snapshot \
            -no-metrics \
            -logcat *:E \
            &> /tmp/emulator.log &
          
          EMU_PID=$!
          echo "Emulator PID: $EMU_PID"
          echo "EMU_PID=$EMU_PID" >> $GITHUB_ENV
          
          # Wait for emulator process
          sleep 5
          if ! ps -p $EMU_PID > /dev/null; then
            echo "::error::Emulator process died immediately!"
            echo "=== Emulator Log ==="
            cat /tmp/emulator.log
            exit 1
          fi
          
          echo "Emulator process alive, waiting for ADB..."
          
          # Use SDK adb
          ADB=$ANDROID_SDK_ROOT/platform-tools/adb
          
          # Wait for device to appear in adb
          TIMEOUT=300
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            if $ADB devices 2>/dev/null | grep -q "emulator-5554"; then
              echo "✓ Emulator detected in ADB!"
              break
            fi
            sleep 5
            ELAPSED=$((ELAPSED + 5))
            echo "  Waiting... ${ELAPSED}s / ${TIMEOUT}s"
          done
          
          if ! $ADB devices 2>/dev/null | grep -q "emulator"; then
            echo "::error::Emulator not detected after ${TIMEOUT}s"
            echo "=== ADB devices ==="
            $ADB devices
            echo "=== Emulator Log (last 100 lines) ==="
            tail -100 /tmp/emulator.log
            exit 1
          fi
          
          # Wait for boot completion
          echo "Waiting for full Android boot..."
          BOOT_TIMEOUT=300
          BOOT_ELAPSED=0
          while [ $BOOT_ELAPSED -lt $BOOT_TIMEOUT ]; do
            BOOT=$(timeout 5 $ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n')
            if [ "$BOOT" = "1" ]; then
              echo "✓ Android fully booted!"
              break
            fi
            sleep 10
            BOOT_ELAPSED=$((BOOT_ELAPSED + 10))
            echo "  Boot progress... ${BOOT_ELAPSED}s / ${BOOT_TIMEOUT}s (boot_completed=$BOOT)"
          done
          
          # Verify boot
          BOOT=$(timeout 5 $ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n')
          if [ "$BOOT" != "1" ]; then
            echo "::warning::Boot may not be complete, but continuing..."
          fi
          
          # Show device info
          echo "=== Device Info ==="
          $ADB shell getprop ro.build.version.release
          $ADB shell getprop ro.product.model
          $ADB shell getprop ro.build.display.id
          
          echo "✓ Android Emulator running"

      # ═══════════════════════════════════════════
      # STEP 6: Configure Emulator Screen
      # ═══════════════════════════════════════════
      - name: Configure Emulator Display
        run: |
          ADB=$ANDROID_SDK_ROOT/platform-tools/adb
          
          # Find emulator window in Xvfb
          sleep 3
          EMU_WIN=$(DISPLAY=:99 xdotool search --name "Android Emulator" 2>/dev/null | head -1 || true)
          
          if [ -z "$EMU_WIN" ]; then
            # Try other window names
            EMU_WIN=$(DISPLAY=:99 xdotool search --name "emulator" 2>/dev/null | head -1 || true)
          fi
          
          if [ -n "$EMU_WIN" ]; then
            echo "Found emulator window: $EMU_WIN"
            # Move to top-left corner
            DISPLAY=:99 xdotool windowmove $EMU_WIN 0 0
            # Resize to match screen
            DISPLAY=:99 xdotool windowsize $EMU_WIN 720 1280
            sleep 1
            # Activate
            DISPLAY=:99 xdotool windowactivate $EMU_WIN
            echo "✓ Emulator window positioned"
          else
            echo "Emulator window not found via xdotool — listing all windows:"
            DISPLAY=:99 xdotool search --name "" getwindowname %@ 2>/dev/null || true
            # This is OK — x11vnc will share whole screen anyway
          fi
          
          echo "✓ Display configured"

      # ═══════════════════════════════════════════
      # STEP 7: Start VNC Server
      # ═══════════════════════════════════════════
      - name: Start VNC Server
        run: |
          PASSWD="${{ github.event.inputs.vnc_password || 'android123' }}"
          
          # Kill existing VNC
          sudo pkill x11vnc 2>/dev/null || true
          sleep 1
          
          # Create password file
          x11vnc -storepasswd "$PASSWD" /tmp/vncpass
          
          # Start x11vnc
          x11vnc \
            -display :99 \
            -rfbport 5900 \
            -rfbauth /tmp/vncpass \
            -forever \
            -shared \
            -noxdamage \
            -repeat \
            -cursor arrow \
            -noxrecord \
            -bg \
            -o /tmp/x11vnc.log
          
          sleep 2
          
          # Verify
          if netstat -tln | grep -q 5900; then
            echo "✓ VNC server listening on port 5900"
          else
            echo "::error::VNC not listening!"
            cat /tmp/x11vnc.log
            exit 1
          fi

      # ═══════════════════════════════════════════
      # STEP 8: Start noVNC Web Client
      # ═══════════════════════════════════════════
      - name: Start noVNC
        run: |
          # Kill existing
          sudo pkill websockify 2>/dev/null || true
          sudo pkill -f novnc 2>/dev/null || true
          sleep 1
          
          # Find noVNC web root
          if [ -d /usr/share/novnc ]; then
            NOVNC_ROOT=/usr/share/novnc
          elif [ -f /usr/share/novnc/vnc.html ]; then
            NOVNC_ROOT=/usr/share/novnc
          else
            # Download noVNC
            git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/noVNC
            NOVNC_ROOT=/tmp/noVNC
          fi
          
          echo "noVNC root: $NOVNC_ROOT"
          ls $NOVNC_ROOT/vnc.html && echo "vnc.html found"
          
          # Start websockify
          websockify --web $NOVNC_ROOT 6080 localhost:5900 &
          WS_PID=$!
          sleep 2
          
          if ! ps -p $WS_PID > /dev/null; then
            echo "::error::websockify failed"
            exit 1
          fi
          
          if netstat -tln | grep -q 6080; then
            echo "✓ noVNC web client on port 6080"
          else
            echo "::error::noVNC not listening!"
            exit 1
          fi

      # ═══════════════════════════════════════════
      # STEP 9: Setup Cloudflare Tunnel
      # ═══════════════════════════════════════════
      - name: Setup Public Tunnel
        run: |
          # Download cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O /tmp/cloudflared
          chmod +x /tmp/cloudflared
          
          # Kill existing
          sudo pkill cloudflared 2>/dev/null || true
          sleep 1
          
          # Start tunnel — noVNC only (most useful)
          /tmp/cloudflared tunnel --url http://localhost:6080 &> /tmp/cf_tunnel.log &
          
          # Wait for URL
          sleep 15
          
          # Extract URL
          NOVNC_URL=""
          for i in 1 2 3 4 5; do
            NOVNC_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf_tunnel.log | head -1)
            if [ -n "$NOVNC_URL" ]; then
              break
            fi
            echo "Waiting for tunnel URL... attempt $i"
            sleep 5
          done
          
          if [ -z "$NOVNC_URL" ]; then
            echo "::warning::Could not get tunnel URL"
            cat /tmp/cf_tunnel.log
            NOVNC_URL="TUNNEL_FAILED"
          fi
          
          echo "NOVNC_URL=${NOVNC_URL}" >> $GITHUB_ENV
          
          echo ""
          echo "═══════════════════════════════════════════"
          echo "  📱 ANDROID VIRTUAL PHONE - ACTIVE"
          echo "═══════════════════════════════════════════"
          echo "  noVNC Browser: ${NOVNC_URL}/vnc.html"
          echo "  VNC Password:  ${{ github.event.inputs.vnc_password || 'android123' }}"
          echo "═══════════════════════════════════════════"
          echo ""

      # ═══════════════════════════════════════════
      # STEP 10: Display Connection Info
      # ═══════════════════════════════════════════
      - name: Connection Info
        run: |
          ADB=$ANDROID_SDK_ROOT/platform-tools/adb
          
          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║      📱 ANDROID VIRTUAL PHONE - VNC SERVER ACTIVE 📱      ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║                                                          ║"
          echo "║  METHOD 1: Browser (noVNC) — RECOMMENDED                ║"
          echo "║  ──────────────────────────────────────────              ║"
          echo "║  URL: ${NOVNC_URL}/vnc.html"
          echo "║  Password: ${{ github.event.inputs.vnc_password || 'android123' }}"
          echo "║                                                          ║"
          echo "║  METHOD 2: ADB (for scrcpy, debugging)                   ║"
          echo "║  ─────────────────────────────────────                    ║"
          echo "║  Emulator is running on emulator-5554                    ║"
          echo "║                                                          ║"
          echo "║  Device Status:                                          ║"
          $ADB devices
          echo "║  Android Version: $($ADB shell getprop ro.build.version.release 2>/dev/null || echo 'unknown')"
          echo "║                                                          ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""

      # ═══════════════════════════════════════════
      # STEP 11: Keep Alive Monitor
      # ═══════════════════════════════════════════
      - name: Keep Alive
        timeout-minutes: 360
        run: |
          ADB=$ANDROID_SDK_ROOT/platform-tools/adb
          SESSION_MIN="${{ github.event.inputs.session_minutes || '300' }}"
          START=$(date +%s)
          END=$((START + SESSION_MIN * 60))
          
          echo "Session will run for ${SESSION_MIN} minutes"
          echo "Monitor loop started..."
          
          CHECK_COUNT=0
          
          while [ $(date +%s) -lt $END ]; do
            sleep 60
            CHECK_COUNT=$((CHECK_COUNT + 1))
            UPTIME=$(( ($(date +%s) - START) / 60 ))
            
            # Health check
            ALL_OK=true
            
            # Check emulator alive
            if ! pgrep -f "emulator.*android-phone" > /dev/null; then
              echo "[$(date)] ⚠️ Emulator process not found!"
              ALL_OK=false
            fi
            
            # Check ADB responsive
            if ! timeout 5 $ADB shell echo "ping" &>/dev/null; then
              echo "[$(date)] ⚠️ ADB not responding!"
              ALL_OK=false
            fi
            
            # Check VNC alive
            if ! netstat -tln | grep -q 5900; then
              echo "[$(date)] ⚠️ VNC dead, restarting..."
              x11vnc -display :99 -rfbport 5900 -rfbauth /tmp/vncpass \
                -forever -shared -noxdamage -bg -o /tmp/x11vnc.log
              ALL_OK=false
            fi
            
            # Check noVNC alive
            if ! netstat -tln | grep -q 6080; then
              echo "[$(date)] ⚠️ noVNC dead, restarting..."
              NOVNC_ROOT=/usr/share/novnc
              [ ! -d "$NOVNC_ROOT" ] && NOVNC_ROOT=/tmp/noVNC
              websockify --web $NOVNC_ROOT 6080 localhost:5900 &
            fi
            
            # Check tunnel alive
            if ! pgrep cloudflared > /dev/null; then
              echo "[$(date)] ⚠️ Tunnel dead, restarting..."
              /tmp/cloudflared tunnel --url http://localhost:6080 &> /tmp/cf_tunn
