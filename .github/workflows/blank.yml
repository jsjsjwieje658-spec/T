name: Android Virtual Phone (VNC Server)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'VNC Password'
        required: false
        default: 'android123'
      api_level:
        description: 'Android API Level (30-34)'
        required: false
        default: '33'
      session_minutes:
        description: 'Duration minutes (max 350)'
        required: false
        default: '300'

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  DISPLAY: :99

jobs:
  android-vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ═══════════════════════════════════════════
      # STEP 1: Install emulator + system image
      # ═══════════════════════════════════════════
      - name: Install Emulator and System Image
        run: |
          SDK=$ANDROID_SDK_ROOT
          SDKMANAGER=$SDK/cmdline-tools/latest/bin/sdkmanager
          
          # Accept licenses first
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          
          API="${{ github.event.inputs.api_level || '33' }}"
          
          echo "Installing emulator, platform-tools, system image API $API..."
          yes | $SDKMANAGER \
            "emulator" \
            "platform-tools" \
            "system-images;android-${API};google_apis;x86_64" \
            > /dev/null 2>&1
          
          # Verify emulator now exists
          if [ -f "$SDK/emulator/emulator" ]; then
            echo "✓ Emulator installed at $SDK/emulator/emulator"
            $SDK/emulator/emulator --version
          else
            echo "::error::Emulator still not found!"
            ls -la $SDK/emulator/ 2>/dev/null || echo "emulator dir missing"
            exit 1
          fi
          
          # Add to PATH for subsequent steps
          echo "$SDK/emulator" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH

      # ═══════════════════════════════════════════
      # STEP 2: Fix KVM permissions
      # ═══════════════════════════════════════════
      - name: Fix KVM
        run: |
          sudo chmod 666 /dev/kvm
          echo "✓ KVM ready"
          ls -la /dev/kvm

      # ═══════════════════════════════════════════
      # STEP 3: Install VNC deps
      # ═══════════════════════════════════════════
      - name: Install VNC dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            xvfb \
            x11vnc \
            xdotool \
            fluxbox \
            novnc \
            websockify \
            net-tools
          echo "✓ VNC deps installed"

      # ═══════════════════════════════════════════
      # STEP 4: Start virtual display
      # ═══════════════════════════════════════════
      - name: Start Virtual Display
        run: |
          sudo pkill Xvfb 2>/dev/null || true
          sleep 1
          
          Xvfb :99 -screen 0 1080x1920x24 -ac +extension GLX +render -noreset &
          sleep 3
          
          DISPLAY=:99 fluxbox &
          sleep 2
          
          DISPLAY=:99 xdotool getdisplaygeometry
          echo "✓ Xvfb on :99 (1080x1920)"

      # ═══════════════════════════════════════════
      # STEP 5: Create AVD
      # ═══════════════════════════════════════════
      - name: Create AVD
        run: |
          SDK=$ANDROID_SDK_ROOT
          AVDMANAGER=$SDK/cmdline-tools/latest/bin/avdmanager
          API="${{ github.event.inputs.api_level || '33' }}"
          
          # Delete if exists
          rm -rf ~/.android/avd/android-phone* 2>/dev/null || true
          
          echo "no" | $AVDMANAGER create avd \
            --name android-phone \
            --package "system-images;android-${API};google_apis;x86_64" \
            --device "pixel_4" \
            --force
          
          # Verify AVD
          $AVDMANAGER list avd | head -10
          echo "✓ AVD created"

      # ═══════════════════════════════════════════
      # STEP 6: Boot Android Emulator
      # ═══════════════════════════════════════════
      - name: Boot Android Emulator
        run: |
          SDK=$ANDROID_SDK_ROOT
          EMU=$SDK/emulator/emulator
          ADB=$SDK/platform-tools/adb
          
          # Write config for reasonable screen
          mkdir -p ~/.android
          cat > ~/.android/avd/android-phone.avd/config.ini << EOF
          hw.lcd.width=720
          hw.lcd.height=1280
          hw.lcd.density=320
          hw.ramSize=2048
          hw.cpu.ncore=2
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.keyboard=yes
          hw.audioInput=no
          hw.audioOutput=no
          hw.camera.back=none
          hw.camera.front=none
          disk.dataPartition.size=4G
          EOF
          
          echo "Starting emulator..."
          $EMU \
            -avd android-phone \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -no-metrics \
            &> /tmp/emulator.log &
          
          EMU_PID=$!
          echo "Emulator PID: $EMU_PID"
          
          # Wait for process to stay alive
          sleep 10
          if ! ps -p $EMU_PID > /dev/null; then
            echo "::error::Emulator died! Log:"
            cat /tmp/emulator.log
            exit 1
          fi
          
          # Wait for ADB device
          echo "Waiting for emulator in ADB (max 5 min)..."
          for i in $(seq 1 60); do
            if $ADB devices 2>/dev/null | grep -q "emulator-"; then
              echo "✓ Emulator detected in ADB!"
              break
            fi
            sleep 5
          done
          
          if ! $ADB devices 2>/dev/null | grep -q "emulator-"; then
            echo "::error::Emulator not detected in ADB after 5 minutes"
            $ADB devices
            tail -100 /tmp/emulator.log
            exit 1
          fi
          
          # Wait for full boot
          echo "Waiting for boot complete (max 5 min)..."
          for i in $(seq 1 60); do
            BOOT=$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n ')
            if [ "$BOOT" = "1" ]; then
              echo "✓ Android booted!"
              break
            fi
            sleep 5
            echo "  ...booting ($i)"
          done
          
          # Final check
          BOOT=$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n ')
          if [ "$BOOT" != "1" ]; then
            echo "::warning::Boot may not complete, continuing anyway..."
          fi
          
          $ADB devices
          $ADB shell getprop ro.build.version.release || true
          echo "✓ Emulator running"

      # ═══════════════════════════════════════════
      # STEP 7: Start VNC + noVNC
      # ═══════════════════════════════════════════
      - name: Start VNC Server
        run: |
          PASSWD="${{ github.event.inputs.vnc_password || 'android123' }}"
          
          # Position emulator window
          sleep 3
          WIN=$(DISPLAY=:99 xdotool search --name "Android" 2>/dev/null | head -1)
          if [ -n "$WIN" ]; then
            DISPLAY=:99 xdotool windowmove $WIN 0 0
            DISPLAY=:99 xdotool windowsize $WIN 720 1280
            DISPLAY=:99 xdotool windowactivate $WIN
          fi
          
          # Start x11vnc
          x11vnc -storepasswd "$PASSWD" /tmp/vncpass
          x11vnc -display :99 -rfbport 5900 -rfbauth /tmp/vncpass \
            -forever -shared -noxdamage -repeat -bg -o /tmp/x11vnc.log
          
          sleep 2
          netstat -tln | grep 5900 && echo "✓ VNC on :5900"

      - name: Start noVNC
        run: |
          NOVNC_ROOT=/usr/share/novnc
          [ ! -d "$NOVNC_ROOT" ] && NOVNC_ROOT=/tmp/noVNC
          
          websockify --web $NOVNC_ROOT 6080 localhost:5900 &
          sleep 2
          netstat -tln | grep 6080 && echo "✓ noVNC on :6080"

      # ═══════════════════════════════════════════
      # STEP 8: Public tunnel
      # ═══════════════════════════════════════════
      - name: Setup Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O /tmp/cloudflared
          chmod +x /tmp/cloudflared
          
          /tmp/cloudflared tunnel --url http://localhost:6080 &> /tmp/cf.log &
          sleep 15
          
          URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -1)
          
          if [ -n "$URL" ]; then
            echo "NOVNC_URL=$URL" >> $GITHUB_ENV
            echo ""
            echo "╔═════════════════════════════════════════╗"
            echo "║  📱 ANDROID PHONE ACTIVE                 ║"
            echo "╠═════════════════════════════════════════╣"
            echo "║  Browser:  $URL/vnc.html"
            echo "║  Password: ${{ github.event.inputs.vnc_password || 'android123' }}"
            echo "╚═════════════════════════════════════════╝"
          else
            echo "::warning::Tunnel URL not found"
            cat /tmp/cf.log
          fi

      # ═══════════════════════════════════════════
      # STEP 9: Keep alive
      # ═══════════════════════════════════════════
      - name: Keep Alive
        timeout-minutes: 360
        run: |
          ADB=$ANDROID_SDK_ROOT/platform-tools/adb
          MIN="${{ github.event.inputs.session_minutes || '300' }}"
          START=$(date +%s)
          END=$((START + MIN * 60))
          
          while [ $(date +%s) -lt $END ]; do
            sleep 60
            UPTIME=$(( ($(date +%s) - START) / 60 ))
            
            # Health: VNC
            if ! netstat -tln | grep -q 5900; then
              x11vnc -display :99 -rfbport 5900 -rfbauth /tmp/vncpass \
                -forever -shared -bg
              echo "[$(date)] VNC restarted"
            fi
            
            # Health: noVNC
            if ! netstat -tln | grep -q 6080; then
              websockify --web /usr/share/novnc 6080 localhost:5900 &
              echo "[$(date)] noVNC restarted"
            fi
            
            # Health: tunnel
            if ! pgrep cloudflared > /dev/null; then
              /tmp/cloudflared tunnel --url http://localhost:6080 &> /tmp/cf_new.log &
              sleep 10
              NEW=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf_new.log | head -1)
              if [ -n "$NEW" ]; then
                echo "[$(date)] NEW URL: $NEW/vnc.html"
              fi
            fi
            
            echo "[$(date)] ✓ Uptime: ${UPTIME}min"
          done

      # ═══════════════════════════════════════════
      # STEP 10: Cleanup
      # ═══════════════════════════════════════════
      - name: Cleanup
        if: always()
        run: |
          $ANDROID_SDK_ROOT/platform-tools/adb emu kill 2>/dev/null || true
          sudo pkill -f emulator 2>/dev/null || true
          sudo pkill x11vnc 2>/dev/null || true
          sudo pkill websockify 2>/dev/null || true
          sudo pkill cloudflared 2>/dev/null || true
          sudo pkill Xvfb 2>/dev/null || true
          echo "✓ Cleanup done"
