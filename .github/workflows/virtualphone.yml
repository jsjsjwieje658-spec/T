name: Android Virtual Phone (VNC Server)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'VNC Password'
        required: false
        default: 'android123'
      api_level:
        description: 'Android API Level (30-34)'
        required: false
        default: '30'
      session_minutes:
        description: 'Duration minutes (max 350)'
        required: false
        default: '300'

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  DISPLAY: :99

jobs:
  android-vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpulse0 libgl1 libnss3 libxcomposite1 libxcursor1 \
            libxdamage1 libxi6 libxtst6 libxrandr2 libasound2t64 \
            libvulkan1 mesa-utils \
            xvfb x11vnc xdotool fluxbox novnc websockify net-tools
          echo "System deps installed"

      - name: Install Emulator and System Image
        run: |
          SDK=$ANDROID_SDK_ROOT
          SDKMANAGER=$SDK/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          API="${{ github.event.inputs.api_level || '30' }}"
          echo "Installing emulator, platform-tools, system image API $API..."
          yes | $SDKMANAGER \
            "emulator" \
            "platform-tools" \
            "system-images;android-${API};google_apis;x86_64"
          test -f "$SDK/emulator/emulator" || { echo "::error::Emulator not found!"; exit 1; }
          echo "Emulator installed"
          echo "$SDK/emulator" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH

      - name: Fix KVM
        run: |
          sudo chmod 666 /dev/kvm
          echo "KVM ready"

      - name: Start Virtual Display
        run: |
          sudo pkill Xvfb 2>/dev/null || true
          sleep 1
          Xvfb :99 -screen 0 1080x1920x24 -ac +extension GLX +render -noreset &
          sleep 3
          DISPLAY=:99 fluxbox &
          sleep 2
          DISPLAY=:99 xdotool getdisplaygeometry
          echo "Xvfb on :99"

      - name: Create AVD
        run: |
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p "$ANDROID_AVD_HOME"
          SDK=$ANDROID_SDK_ROOT
          AVDMANAGER=$SDK/cmdline-tools/latest/bin/avdmanager
          API="${{ github.event.inputs.api_level || '30' }}"
          rm -rf "$ANDROID_AVD_HOME/android-phone"* 2>/dev/null || true
          echo "no" | $AVDMANAGER create avd \
            --name android-phone \
            --package "system-images;android-${API};google_apis;x86_64" \
            --path "$ANDROID_AVD_HOME/android-phone.avd" \
            --force
          echo "--- AVD list ---"
          $AVDMANAGER list avd
          echo "--- Files ---"
          ls -la "$ANDROID_AVD_HOME/"
          ls -la "$ANDROID_AVD_HOME/android-phone.avd/" || true
          if [ ! -f "$ANDROID_AVD_HOME/android-phone.ini" ]; then
            echo "::warning::android-phone.ini not found, creating manually"
            printf 'avd.ini.encoding=UTF-8\npath=%s/android-phone.avd\npath.rel=avd/android-phone.avd\ntarget=android-%s\n' "$ANDROID_AVD_HOME" "$API" > "$ANDROID_AVD_HOME/android-phone.ini"
          fi
          echo "--- android-phone.ini ---"
          cat "$ANDROID_AVD_HOME/android-phone.ini"
          echo "AVD created successfully"

      - name: Boot Android Emulator
        run: |
          export ANDROID_AVD_HOME=$HOME/.android/avd
          SDK=$ANDROID_SDK_ROOT
          EMU=$SDK/emulator/emulator
          ADB=$SDK/platform-tools/adb

          echo "=== AVD Pre-flight Check ==="
          ls -la "$ANDROID_AVD_HOME/"
          cat "$ANDROID_AVD_HOME/android-phone.ini" || { echo "::error::android-phone.ini missing!"; exit 1; }

          # Write custom hardware config (preserve ABI from AVD creation)
          ORIG_ABI=$(grep -E "^hw\.cpu\.arch=" "$ANDROID_AVD_HOME/android-phone.avd/config.ini" | head -1 || echo "hw.cpu.arch=x86_64")
          ORIG_ABI_TAG=$(grep -E "^image\.sysdir\.arms|^tag\.id=" "$ANDROID_AVD_HOME/android-phone.avd/config.ini" | head -1 || true)
          printf '%s\n' \
            "hw.lcd.width=720" \
            "hw.lcd.height=1280" \
            "hw.lcd.density=320" \
            "hw.ramSize=1536" \
            "hw.cpu.ncore=1" \
            "hw.gpu.enabled=yes" \
            "hw.gpu.mode=swiftshader_indirect" \
            "hw.keyboard=yes" \
            "hw.audioInput=no" \
            "hw.audioOutput=no" \
            "hw.camera.back=none" \
            "hw.camera.front=none" \
            "disk.dataPartition.size=4G" \
            "$ORIG_ABI" \
            > "$ANDROID_AVD_HOME/android-phone.avd/config.ini"
          echo "Custom config.ini written (ABI: $ORIG_ABI)"
          echo "Custom config.ini written"
          cat "$ANDROID_AVD_HOME/android-phone.avd/config.ini"

          # Check KVM
          ACCEL_FLAG=""
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM available, using hardware acceleration"
            ACCEL_FLAG="-accel kvm"
          else
            echo "KVM not available, using software acceleration"
            ACCEL_FLAG="-no-accel"
          fi

          echo "Starting emulator..."
          $EMU \
            -avd android-phone \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -no-metrics \
            $ACCEL_FLAG \
            &> /tmp/emulator.log &

          EMU_PID=$!
          echo "Emulator PID: $EMU_PID"
          sleep 15

          if ! ps -p $EMU_PID > /dev/null; then
            echo "::warning::Emulator died on first attempt, retrying without GPU..."
            tail -20 /tmp/emulator.log
            $EMU \
              -avd android-phone \
              -no-window \
              -no-audio \
              -no-boot-anim \
              -no-accel \
              -no-gpu \
              -no-snapshot \
              -no-metrics \
              &> /tmp/emulator.log &
            EMU_PID=$!
            echo "Retry Emulator PID: $EMU_PID"
            sleep 15
            if ! ps -p $EMU_PID > /dev/null; then
              echo "::error::Emulator died on retry!"
              cat /tmp/emulator.log
              exit 1
            fi
          fi

          echo "Waiting for ADB device..."
          $ADB wait-for-device

          echo "Waiting for boot (max 15 min)..."
          for i in $(seq 1 180); do
            BOOT=$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n ')
            if [ "$BOOT" = "1" ]; then
              echo "Android booted!"
              break
            fi
            if [ $((i % 12)) -eq 0 ]; then
              echo "  ...still waiting (${i}0s)"
              tail -5 /tmp/emulator.log
            fi
            sleep 5
          done

          if [ "$BOOT" != "1" ]; then
            echo "::error::Boot timeout"
            tail -50 /tmp/emulator.log
            exit 1
          fi

          $ADB devices
          $ADB shell getprop ro.build.version.release || true
          echo "Emulator running"

      - name: Start VNC Server
        run: |
          PASSWD="${{ github.event.inputs.vnc_password || 'android123' }}"
          sleep 3
          WIN=$(DISPLAY=:99 xdotool search --name "Android" 2>/dev/null | head -1)
          if [ -n "$WIN" ]; then
            DISPLAY=:99 xdotool windowmove $WIN 0 0
            DISPLAY=:99 xdotool windowsize $WIN 720 1280
            DISPLAY=:99 xdotool windowactivate $WIN
          fi
          x11vnc -storepasswd "$PASSWD" /tmp/vncpass
          x11vnc -display :99 -rfbport 5900 -rfbauth /tmp/vncpass \
            -forever -shared -noxdamage -repeat -bg -o /tmp/x11vnc.log
          sleep 2
          netstat -tln | grep 5900 && echo "VNC on :5900"

      - name: Start noVNC
        run: |
          NOVNC_ROOT=/usr/share/novnc
          [ ! -d "$NOVNC_ROOT" ] && NOVNC_ROOT=/tmp/noVNC
          websockify --web $NOVNC_ROOT 6080 localhost:5900 &
          sleep 2
          netstat -tln | grep 6080 && echo "noVNC on :6080"

      - name: Setup Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://localhost:6080 &> /tmp/cf.log &
          sleep 15
          URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -1)
          if [ -n "$URL" ]; then
            echo "NOVNC_URL=$URL" >> $GITHUB_ENV
            echo ""
            echo "==========================================="
            echo "  ANDROID PHONE ACTIVE"
            echo "  Browser:  $URL/vnc.html"
            echo "  Password: ${{ github.event.inputs.vnc_password || 'android123' }}"
            echo "==========================================="
          else
            echo "::warning::Tunnel URL not found"
            cat /tmp/cf.log
          fi

      - name: Keep Alive
        timeout-minutes: 360
        run: |
          MIN="${{ github.event.inputs.session_minutes || '300' }}"
          START=$(date +%s)
          END=$((START + MIN * 60))
          while [ $(date +%s) -lt $END ]; do
            sleep 60
            UPTIME=$(( ($(date +%s) - START) / 60 ))
            if ! netstat -tln | grep -q 5900; then
              x11vnc -display :99 -rfbport 5900 -rfbauth /tmp/vncpass \
                -forever -shared -bg
            fi
            if ! netstat -tln | grep -q 6080; then
              websockify --web /usr/share/novnc 6080 localhost:5900 &
            fi
            if ! pgrep cloudflared > /dev/null; then
              /tmp/cloudflared tunnel --url http://localhost:6080 &> /tmp/cf_new.log &
              sleep 10
            fi
            echo "[$(date)] Uptime: ${UPTIME}min"
          done

      - name: Cleanup
        if: always()
        run: |
          $ANDROID_SDK_ROOT/platform-tools/adb emu kill 2>/dev/null || true
          sudo pkill -f emulator 2>/dev/null || true
          sudo pkill x11vnc 2>/dev/null || true
          sudo pkill websockify 2>/dev/null || true
          sudo pkill cloudflared 2>/dev/null || true
          sudo pkill Xvfb 2>/dev/null || true
          echo "Cleanup done"
